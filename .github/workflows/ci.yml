name: DORADO CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # cryptography is REQUIRED for the signing pod (Ed25519). The deterministic
      # battery itself has no third-party deps, but the signer/verifier do.
      # cbor2 is REQUIRED for the SCITT COSE_Sign1 verifier (RFC 9052 CBOR decode) —
      # the move-31 cryptographic verifier counts nothing it cannot decode + verify.
      - name: Install cryptography + cbor2
        run: pip install cryptography cbor2

      # Hermetic deterministic test battery — NO network, NO Ollama required.
      - name: Deterministic test battery
        run: python3 test/battery.py

      # FROZEN VECTORS v1 (move 6): hash-pinned stranger-verification fixtures.
      # Regeneration is deterministic; the committing test validates the pin +
      # behaviour (card-valid verifies, bad-sig fails, bad-receipt fails card-bind).
      - name: Frozen vectors v1 (hash-pinned, hermetic)
        run: |
          python3 scripts/gen-frozen-vectors.py
          git diff --exit-code test/vectors || { echo "FROZEN VECTORS DRIFT: run scripts/gen-frozen-vectors.py and commit the regenerated vectors"; exit 1; }
          python3 test/frozen-vectors.py

      # FROZEN VECTORS <-> OFFLINE VERIFY-KIT integration (closing round): packs the frozen
      # VALID card + receipt into ONE offline verify-kit and stranger-verifies the WHOLE kit
      # (digest + card signature + receipt bind + identity pin), and proves the frozen
      # bad-sig / bad-receipt vectors fail honestly through the SAME kit path. This is the
      # closing seam the estate must never break — the pinned fixtures and the stranger
      # artifact verify EACH OTHER. Hermetic, deterministic, no network, no pod.
      - name: Frozen vectors <-> verify-kit integration (closing)
        run: python3 test/frozen-vectors-kit.py

      # End-user persona suite — the front end tested as all types of users.
      - name: End-user personas (hermetic)
        run: python3 test/personas.py

      # Elo / Bradley-Terry ranking engine oracle (known-transitive order).
      - name: Elo/Bradley-Terry oracle (hermetic)
        run: python3 test/elo-test.py

      # Banned-lane-brand CI guard on PUBLIC surfaces (allowed: legal 'sovereign' + real infra ids).
      - name: Banned-string lint (public surfaces)
        run: python3 test/banned-strings.py

      # Binding-canongrammar CI guard (moves 39/65): public + staged week-1 external text
      # must use "measurement credential" grammar, never a positive certification claim,
      # and must never over-claim "14 of 14" / "all 14" (canon = "13 measured of 14").
      # --selfcheck also regression-tests both guards against inline fixtures.
      - name: Grammar lint (measurement-credential canon + completeness)
        run: |
          python3 test/grammar-lint.py
          python3 test/grammar-lint.py --selfcheck

      # NO-LLM-JUDGE invariant guard (move 25): the tree must score deterministically
      # (gold-label judge in engine/judge.py, no LLM judges another LLM) and export
      # ratings as measurement-derived data that carries the register + the
      # "never a purchased rank / never the score" neutrality. --selfcheck regression-tests.
      - name: No-LLM-judge invariant (moves 25)
        run: |
          python3 test/no-llm-judge.py
          python3 test/no-llm-judge.py --selfcheck

      # HERMETIC DETERMINISM GATE (move 36): a canned axis-engine fixture run twice with
      # the same key must produce the same card canonical digest, the same Ed25519
      # signature, and the same receipt content_id (issued_at pinned to isolate the sole
      # wall-clock input). Proves determinism + unsealed-never-signed, fully OFF-network.
      - name: Determinism gate (double-run, hermetic)
        run: python3 test/determinism-gate.py

      # 3090 CONTENTION RULE guard (move 30): the GPU-flush preflight must be codified
      # (doctrine doc) and pass its hermetic selftest + CI-friendly --doctor (cadence-lock
      # discipline + honest GPU-deferred note; no score is faked by a contended GPU).
      - name: 3090 contention preflight (move 30)
        run: |
          bash scripts/gpu-flush-preflight.sh --selftest
          bash scripts/gpu-flush-preflight.sh --doctor

      # TELEMETRY SCHEMA guard (move 21): every per-measure telemetry row must validate
      # against the contract engine/or_telemetry.record() emits (model/provider/cost/
      # latency/tokens/throughput), and tok_s must be exactly the emitter-derived value.
      - name: Telemetry schema guard (move 21)
        run: python3 test/telemetry-schema.py

      # CORRECTIONS REGISTER guard (move 33): the append-only + schema contract of the
      # corrections register (csoai.corrections/0.1) is asserted against a point-in-time
      # snapshot (ids unique + monotonic by (date,id), date-embedding, policy asserts
      # append-only, provenance envelope), with any missing status surfaced honestly.
      - name: Corrections register append-only guard (move 33)
        run: python3 test/corrections-register.py

      # REGISTER INDEX consistency guard (move 42, in-repo half): the derived board index
      # must be internally coherent (count==len, chainOk with 0 unlinked gaps, every entry
      # signed + self-consistent), and the index-vs-files boundary is reported honestly.
      - name: Board index consistency guard (move 42)
        run: python3 test/board-index.py

      # LICENCE LANDMINE SWEEP guard (move 34): every third-party import is declared +
      # permissive (only PyCA cryptography/asn1crypto), and no hard-excluded family name
      # appears in any code/data asset (docs/manifest/guard legitimately name the rule).
      - name: Dependency licence landmine sweep (move 34)
        run: python3 test/licence-sweep.py

      # SCENARIO RECEIPT / JCS payload-binding stranger-verify (move 43): a `kind:
      # "scenario"` receipt binds the RFC 8785 canonical form of an arbitrary prompt/probe/
      # refusal record to an issuer at a time. Proves build→verify round-trip, JCS
      # key-order-independent binding, different-payload NOT bound, tamper/unsigned refused,
      # and that scenario vs measurement-card receipts are not cross-confusable.
      - name: Scenario receipt / JCS payload-binding (move 43)
        run: python3 test/scenario-receipt.py

      # GB/T 45654-STYLE credibility gates self-check (move 52): the four quotability gates
      # (calibration >= 90% / over-refusal <= 5% / per-axis n >= 2k / total n >= 10k) are
      # encoded deterministically. A below-floor value is reported honestly (never a
      # fabricated pass), and a single-gate failure marks the run NOT QUOTABLE — a datum,
      # not a finding. Hermetic, no LLM-judge.
      - name: GB/T 45654 credibility gates self-check (move 52)
        run: python3 test/gbt-gates.py

      # SB 315-style machine-readable transparency-summary emitter (move 12): a signed
      # measurement card becomes a machine-readable transparency summary + a stranger/
      # auditor walkthrough template, both bound to the card by its canonical digest
      # (content_sha256 + signed/kid). Honest "N of M" completeness grammar; excluded axes
      # reported honestly; measurement-credential register carried. Deterministic + hermetic.
      - name: SB 315 transparency-summary emitter (move 12)
        run: python3 test/sb315.py

      # SCITT COSE_Sign1 CRYPTOGRAPHIC verify (move 31): count is not verify. Decodes a
      # real COSE_Sign1 CBOR envelope (RFC 9052/RFC 9943, alg -19 Ed25519) and checks the
      # Ed25519 signature over the Sig_structure with cryptography. Tamper (payload/sig/
      # protected header) rejected; wrong caller-pinned key rejected; non-published kid is
      # honestly 'self-consistent but NOT pinned' (never verified-authentic); batch counts
      # verified/failed/unverifiable separately. Deterministic (seeded test key), no network.
      - name: SCITT COSE_Sign1 cryptographic verify (move 31)
        run: |
          python3 test/scitt-verify.py
          python3 cli/dorado.py scitt --fixture

      # OFFLINE STRANGER VERIFY-KIT (move 17): builds ONE deterministic offline bundle
      # (card + payload + receipt + anchor + did:web keys + walkthrough), verifies the WHOLE
      # kit offline (no network, no pod, only cryptography), and exercises the append-only
      # verification counter (usage/provenance ledger, never a validity claim). Tampered
      # card / swapped subject / missing receipt all handled honestly; identity pin is
      # labelled caller-trusted vs kit-bundled so self-bundled keys are never mistaken for
      # an independently-fetched did:web authentication. Deterministic, no network.
      - name: Offline stranger verify-kit + counter (move 17)
        run: |
          python3 test/verify-kit.py
          python3 cli/dorado.py verify-kit --fixture

      # ISSUANCE-VELOCITY / RATE-CAP attestation (move 51): the estate attests its OWN
      # issuance velocity honestly — an over-cap window is reported VERBATIM, never silently
      # clipped or re-rated (anti-Goodhart / nobody-ranked-pays). The controller derives its
      # window partition ONLY from event timestamps (no wall clock), produces a deterministic
      # `csoai.velocity-attestation/0.1` card carried by the measurement-credential register
      # (a self-audit record, never a certification), signs it and stranger-verifies it
      # (cryptography only). No LLM-judge; hermetic + off-network.
      - name: Issuance-velocity / rate-cap attestation (move 51)
        run: |
          python3 test/rate-cap.py
          python3 cli/dorado.py velocity --fixture

      # GAME seed→replay→receipt→stranger-verify determinism (moves 45/44/36): the games
      # (connect4/ttt/rps/connectx/halite, + nim + wythoff added in move 22) run as
      # deterministic replay records, each JCS-bound to an issuer in a kind:"scenario"
      # receipt and stranger-verified. Asserts seed->replay determinism, double-run
      # determinism (identical receipt content_id/digest), a different-seed/altered
      # transcript NOT bound, and the measurement-credential register. Pure-Python
      # deterministic engines — no network, no LLM-judge, no external game runtime.
      - name: Game replay -> receipt -> stranger-verify determinism (moves 45/44/36/22)
        run: python3 test/game-replay.py

      # INSPECT (MIT) SIGNED-RECEIPT SCORER HOOK (move 59): every Inspect-style `Score`
      # result carries cryptographic provenance (an a2a.signed-receipt/0.1, kind:"score") a
      # stranger verifies offline. Provenance rides, never alters, the measurement (the
      # value/explanation are preserved verbatim). The receiver re-derives the Score payload
      # (RFC 8785 JCS) and verifies the receipt's Ed25519 signature AND that it binds THIS
      # result — a tampered value/model/subject silently fails the bind. A Score with no
      # receipt is honestly-unsigned (never invented). kind:"score" is NOT cross-confusable
      # with a measurement-card receipt. Hermetic, no network, no pod, no inspect_ai import.
      - name: Inspect signed-receipt scorer hook (move 59)
        run: |
          python3 test/inspect-hook.py
          python3 cli/dorado.py inspect-hook --fixture

      # CI BOLA schema re-validation (structural, no jsonschema dependency).
      - name: Schema CI (example card)
        run: python3 test/schema-test.py

      # The axis engine harness must import cleanly and emit a valid card shape
      # under Python 3.11/3.12 (metadata check; actual measurement requires Ollama).
      - name: Harness import + card shape
        run: |
          python3 -c "
          import sys, json, os
          sys.path.insert(0, os.path.join(os.getcwd(), 'harness'))
          import run_axis as rax
          axes = json.load(open('axes/gspc-16.json'))['axes']
          fake = {'model':'t','n':16,'ok':9,'accuracy':0.562,'measured':16,'total':16,'ts':'2026-08-23T00:00:00Z',
                  'per_axis':[{'axis':a['slug'],'gold':a['gold'],'verdict':'PASS' if i<9 else 'FAIL','resp':'x','measured':True} for i,a in enumerate(axes)]}
          card = rax.as_card(fake, {'id':'t','name':'T','digest':'x'})
          assert card['schema'] == 'https://dorado.dev/schemas/measurement-card.schema.json'
          assert len(card['scores']) == 16
          print('HARNESS CI: PASS — card shape valid, 16 scores')
          "

      - name: CLI smoke — axes + selfcheck
        run: |
          python3 cli/dorado.py axes >/dev/null
          python3 cli/dorado.py selfcheck >/dev/null
          echo "CLI CI: PASS"

      # Signing pod + stranger verifier + data exporter, all hermetic w/ an
      # EPHEMERAL key (the real #card-attestation-1 private half is never in CI).
      - name: Sign → verify → export (hermetic, ephemeral key)
        run: |
          python3 - <<'PYEOF'
          import json, sys, os, subprocess, base64
          sys.path.insert(0, os.path.join(os.getcwd(), 'engine'))
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey
          from cryptography.hazmat.primitives import serialization
          from dorado_sign import sign as sign_card
          from dorado_verify import verify_card
          axes = json.load(open('axes/gspc-16.json'))['axes']
          # build a synthetic axis result + card
          sys.path.insert(0, os.path.join(os.getcwd(), 'harness'))
          import run_axis as rax
          fake = {'model':'t','n':16,'ok':9,'accuracy':0.562,'measured':16,'total':16,'ts':'2026-08-23T00:00:00Z',
                  'per_axis':[{'axis':a['slug'],'gold':a['gold'],'verdict':'PASS' if i<9 else 'FAIL','resp':'x','measured':True} for i,a in enumerate(axes)]}
          card = rax.as_card(fake, {'id':'t','name':'T','digest':'x'})
          key = Ed25519PrivateKey.generate()
          signed = sign_card(card, key, kid='did:web:csoai.org#card-attestation-1', allow_test_identity=True)
          # stranger-verify
          v = verify_card(signed)
          assert v['ok'], v['reason']
          # tamper must fail
          t = json.loads(json.dumps(signed)); t['scores']['governance']['score']=0.999
          assert not verify_card(t)['ok']
          # export data product
          from export_data import export, write_jsonl
          d = export(fake, {'id':'t','name':'T'})
          assert len(d['qa'])==16 and len(d['preference_pairs'])==16
          assert all('not a certification' in json.dumps(r['provenance']) for r in d['preference_pairs'])
          # SCITT receipt (RFC 9943) roundtrip + card-bind + tamper-detect
          from dorado_receipt import build_card_receipt
          from dorado_receipt_verify import verify_receipt
          import hashlib as _hl
          from dorado_sign import canonical as card_canonical
          rcp = build_card_receipt(card, private_key=key, kid='did:web:csoai.org#card-attestation-1')
          assert verify_receipt(rcp)['ok'], verify_receipt(rcp)['reason']
          assert rcp['subject_content_sha256'] == _hl.sha256(card_canonical(card)).hexdigest()
          bad = json.loads(json.dumps(card)); bad['subject']['id']='x'
          assert not verify_receipt(rcp, bad)['ok']  # receipt must not attest to a different card
          tr = json.loads(json.dumps(rcp)); tr['claims'][0]['detail']='altered'
          assert not verify_receipt(tr)['ok']  # tamper rejected
          # anchor shape (hermetic) + license manifest shape
          from dorado_anchor import card_digest
          from dorado_anchor_verify import verify_anchor
          dig = card_digest(card)
          fa = {"schema":"csoai.card-anchor/0.1","card_content_sha256":dig,
                "anchors":[{"kind":"tsa-rfc3161","digest_sha256":dig,"message_imprint_matches":True,"gen_time":"2026-08-23T00:00:00Z"},
                           {"kind":"rekor-transparency-log","recorded":False,"optional":True}]}
          assert verify_anchor(fa, card)['ok']
          wl = json.loads(json.dumps(fa)); wl['card_content_sha256']='deadbeef'
          assert not verify_anchor(wl, card)['ok']
          lp = {"schema":"csoai.data-license/0.1","licensee":"X","dataset_id":"d","term_months":12,
                "price_gbp":5000,"bound_card_content_sha256":dig,
                "neutrality":"licenses the measured data, never the score",
                "register":"This data is derived from a measurement. It is not a certification, endorsement, or conformity mark, and must not be presented as one.","signature":None}
          assert lp['schema']=="csoai.data-license/0.1" and "never the score" in lp['neutrality']
          # domain registries (the horizontal set the vertical verifies)
          import os as _os
          from harness.run_axis import load_axes
          ddir = _os.path.join(os.getcwd(),'axes','domains')
          dnames = sorted(f[:-5] for f in _os.listdir(ddir) if f.endswith('.json'))
          assert len(dnames) >= 6, dnames
          _gov = {'bond','bank','insurance','equity','index','cross-border'}
          for dn in dnames:
              daxes, _reg = load_axes(dn)
              assert len(daxes) >= 5, dn
              assert all(a['probe'].strip() for a in daxes), dn
              if dn in _gov:
                  assert all(a['gold'] in {'PROHIBITED','PERMITTED','REFUSE'} for a in daxes), dn
              elif dn == 'operational':
                  assert all(a['gold'] in {'LOW','HIGH'} for a in daxes), dn
              elif dn == 'relative':
                  assert all(a['gold'] in {'A','B'} for a in daxes), dn
          # domain-scoped card shape
          axes_b,_ = load_axes('bond')
          fake2 = {"model":"d","registry":"csoai.gspc-domains/bond/1.0","n":len(axes_b),"ok":4,"accuracy":0.6,
                   "measured":len(axes_b),"total":len(axes_b),"ts":"2026-08-23T00:00:00Z",
                   "per_axis":[{"axis":a['slug'],"gold":a['gold'],"verdict":("PASS" if i<4 else "FAIL"),"resp":"x","measured":True} for i,a in enumerate(axes_b)]}
          c2 = rax.as_card(fake2, {'id':'d','name':'d','digest':'x'}, axes=axes_b)
          assert c2['benchmark']['id']=='csoai.gspc-domains/bond/1.0' and len(c2['scores'])==len(axes_b)
          # crosswalk (east-west bridge): every domain has a provision map keyed to its axes
          from harness.run_axis import provision_map_for
          for dn2 in dnames:
              pm2 = provision_map_for(dn2)
              if dn2 in _gov:
                  assert pm2 is not None and set(pm2.keys()) == {a['slug'] for a in load_axes(dn2)[0]}
                  assert all(isinstance(v,list) and v and all(isinstance(p,str) and p for p in v) for v in pm2.values())
              else:
                  assert pm2 is None, dn2  # operational/relative are not provision-mapped
          assert provision_map_for(None) is None and 'provision_map' in c2 and len(c2['provision_map'])==6
          # A2A / MCP discovery surface (hermetic, in-process dispatch)
          import os as _os
          assert _os.path.exists(_os.path.join(os.getcwd(),'agent','agent.json'))
          assert _os.path.exists(_os.path.join(os.getcwd(),'agent','agent-card.json'))
          assert _os.path.exists(_os.path.join(os.getcwd(),'agent','mcp_server.py'))
          assert _os.path.exists(_os.path.join(os.getcwd(),'llms.txt'))
          assert _os.path.exists(_os.path.join(os.getcwd(),'a2a.md'))
          sys.path.insert(0, _os.path.join(os.getcwd(),'agent'))
          from mcp_server import dispatch
          disp_card = signed  # already-signed card from earlier in the CI step
          assert 'ok' in dispatch('dorado.verify', {'card': disp_card})
          assert set(dispatch('dorado.listDomains', {})['domains']) >= set(dnames)
          assert len(dispatch('dorado.crosswalk', {'domain':'cross-border'}))==6
          assert 'error' in dispatch('dorado.nope', {})
          # A2A client full-chain audit (spawns mcp_server as subprocess; hermetic)
          sys.path.insert(0, _os.path.join(os.getcwd(),'agent'))
          from dorado_a2a_client import audit as _audit
          import tempfile as _tmp
          _td = _tmp.mkdtemp()
          from dorado_receipt import build_card_receipt as _bcr
          from dorado_anchor import card_digest as _cd
          _sc2 = sign_card(card, key, kid='did:web:csoai.org#card-attestation-1', allow_test_identity=True)
          _rc2 = _bcr(_sc2, private_key=key, kid='did:web:csoai.org#card-attestation-1')
          _an2 = {"schema":"csoai.card-anchor/0.1","card_content_sha256":_cd(_sc2),
                  "anchors":[{"kind":"tsa-rfc3161","digest_sha256":_cd(_sc2),"message_imprint_matches":True,"gen_time":"2026-08-23T00:00:00Z"}]}
          _cp,_rp,_ap = _os.path.join(_td,'c.json'),_os.path.join(_td,'r.json'),_os.path.join(_td,'a.json')
          json.dump(_sc2,open(_cp,'w')); json.dump(_rc2,open(_rp,'w')); json.dump(_an2,open(_ap,'w'))
          _rep = _audit(_cp,_rp,_ap,server=_os.path.join(_os.getcwd(),'agent','mcp_server.py'))
          assert _rep['ok'] and all(s['ok'] for s in _rep['steps'])
          assert _os.path.exists(_os.path.join(os.getcwd(),'verify.html'))
          assert 'verify.html' in open(_os.path.join(os.getcwd(),'index.html')).read()
          # measurement board: content-address = digest, refuses unsigned, chain OK
          import tempfile as _tmpb
          _bd2 = _tmpb.mkdtemp()
          _prior = _os.environ.get('DORADO_BOARD_DIR'); _os.environ['DORADO_BOARD_DIR']=_bd2
          from harness.dorado_board import publish as _bp, rebuild_index as _bi, _card_hash as _bh
          try:
              _bp(card)  # card is unsigned -> refuse
              raise SystemExit('board should refuse unsigned')
          except ValueError:
              pass
          _sb2 = _sc2  # already-signed card from earlier in the step
          _eb = _bp(_sb2, _rc2)
          assert _eb.get('signed') is True and _eb['hash'] == _bh(_sb2)
          assert _bp(_sb2, _rc2).get('deduped', False)
          _ib = _bi()
          assert _ib['count'] >= 1 and _ib['chainOk']
          if _prior:
              _os.environ['DORADO_BOARD_DIR']=_prior
          else:
              _os.environ.pop('DORADO_BOARD_DIR',None)
          print('SIGN-VERIFY-EXPORT-RECEIPT-ANCHOR-LICENSE-DOMAINS-CROSSWALK-MCP-A2A-CLIENT-BOARD CI: PASS')
          PYEOF
