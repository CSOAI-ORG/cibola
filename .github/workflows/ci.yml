name: DORADO CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # cryptography is REQUIRED for the signing pod (Ed25519). The deterministic
      # battery itself has no third-party deps, but the signer/verifier do.
      - name: Install cryptography
        run: pip install cryptography

      # Hermetic deterministic test battery — NO network, NO Ollama required.
      - name: Deterministic test battery
        run: python3 test/battery.py

      # End-user persona suite — the front end tested as all types of users.
      - name: End-user personas (hermetic)
        run: python3 test/personas.py

      # Elo / Bradley-Terry ranking engine oracle (known-transitive order).
      - name: Elo/Bradley-Terry oracle (hermetic)
        run: python3 test/elo-test.py

      # CI BOLA schema re-validation (structural, no jsonschema dependency).
      - name: Schema CI (example card)
        run: python3 test/schema-test.py

      # The axis engine harness must import cleanly and emit a valid card shape
      # under Python 3.11/3.12 (metadata check; actual measurement requires Ollama).
      - name: Harness import + card shape
        run: |
          python3 -c "
          import sys, json, os
          sys.path.insert(0, os.path.join(os.getcwd(), 'harness'))
          import run_axis as rax
          axes = json.load(open('axes/gspc-16.json'))['axes']
          fake = {'model':'t','n':16,'ok':9,'accuracy':0.562,'measured':16,'total':16,'ts':'2026-08-23T00:00:00Z',
                  'per_axis':[{'axis':a['slug'],'gold':a['gold'],'verdict':'PASS' if i<9 else 'FAIL','resp':'x','measured':True} for i,a in enumerate(axes)]}
          card = rax.as_card(fake, {'id':'t','name':'T','digest':'x'})
          assert card['schema'] == 'https://dorado.dev/schemas/measurement-card.schema.json'
          assert len(card['scores']) == 16
          print('HARNESS CI: PASS — card shape valid, 16 scores')
          "

      - name: CLI smoke — axes + selfcheck
        run: |
          python3 cli/dorado.py axes >/dev/null
          python3 cli/dorado.py selfcheck >/dev/null
          echo "CLI CI: PASS"

      # Signing pod + stranger verifier + data exporter, all hermetic w/ an
      # EPHEMERAL key (the real #card-attestation-1 private half is never in CI).
      - name: Sign → verify → export (hermetic, ephemeral key)
        run: |
          python3 - <<'PYEOF'
          import json, sys, os, subprocess, base64
          sys.path.insert(0, os.path.join(os.getcwd(), 'engine'))
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey
          from cryptography.hazmat.primitives import serialization
          from dorado_sign import sign as sign_card
          from dorado_verify import verify_card
          axes = json.load(open('axes/gspc-16.json'))['axes']
          # build a synthetic axis result + card
          sys.path.insert(0, os.path.join(os.getcwd(), 'harness'))
          import run_axis as rax
          fake = {'model':'t','n':16,'ok':9,'accuracy':0.562,'measured':16,'total':16,'ts':'2026-08-23T00:00:00Z',
                  'per_axis':[{'axis':a['slug'],'gold':a['gold'],'verdict':'PASS' if i<9 else 'FAIL','resp':'x','measured':True} for i,a in enumerate(axes)]}
          card = rax.as_card(fake, {'id':'t','name':'T','digest':'x'})
          key = Ed25519PrivateKey.generate()
          signed = sign_card(card, key, kid='did:web:csoai.org#card-attestation-1', allow_test_identity=True)
          # stranger-verify
          v = verify_card(signed)
          assert v['ok'], v['reason']
          # tamper must fail
          t = json.loads(json.dumps(signed)); t['scores']['governance']['score']=0.999
          assert not verify_card(t)['ok']
          # export data product
          from export_data import export, write_jsonl
          d = export(fake, {'id':'t','name':'T'})
          assert len(d['qa'])==16 and len(d['preference_pairs'])==16
          assert all('not a certification' in json.dumps(r['provenance']) for r in d['preference_pairs'])
          # SCITT receipt (RFC 9943) roundtrip + card-bind + tamper-detect
          from dorado_receipt import build_card_receipt
          from dorado_receipt_verify import verify_receipt
          import hashlib as _hl
          from dorado_sign import canonical as card_canonical
          rcp = build_card_receipt(card, private_key=key, kid='did:web:csoai.org#card-attestation-1')
          assert verify_receipt(rcp)['ok'], verify_receipt(rcp)['reason']
          assert rcp['subject_content_sha256'] == _hl.sha256(card_canonical(card)).hexdigest()
          bad = json.loads(json.dumps(card)); bad['subject']['id']='x'
          assert not verify_receipt(rcp, bad)['ok']  # receipt must not attest to a different card
          tr = json.loads(json.dumps(rcp)); tr['claims'][0]['detail']='altered'
          assert not verify_receipt(tr)['ok']  # tamper rejected
          # anchor shape (hermetic) + license manifest shape
          from dorado_anchor import card_digest
          from dorado_anchor_verify import verify_anchor
          dig = card_digest(card)
          fa = {"schema":"csoai.card-anchor/0.1","card_content_sha256":dig,
                "anchors":[{"kind":"tsa-rfc3161","digest_sha256":dig,"message_imprint_matches":True,"gen_time":"2026-08-23T00:00:00Z"},
                           {"kind":"rekor-transparency-log","recorded":False,"optional":True}]}
          assert verify_anchor(fa, card)['ok']
          wl = json.loads(json.dumps(fa)); wl['card_content_sha256']='deadbeef'
          assert not verify_anchor(wl, card)['ok']
          lp = {"schema":"csoai.data-license/0.1","licensee":"X","dataset_id":"d","term_months":12,
                "price_gbp":5000,"bound_card_content_sha256":dig,
                "neutrality":"licenses the measured data, never the score",
                "register":"This data is derived from a measurement. It is not a certification, endorsement, or conformity mark, and must not be presented as one.","signature":None}
          assert lp['schema']=="csoai.data-license/0.1" and "never the score" in lp['neutrality']
          # domain registries (the horizontal set the vertical verifies)
          import os as _os
          from harness.run_axis import load_axes
          ddir = _os.path.join(os.getcwd(),'axes','domains')
          dnames = sorted(f[:-5] for f in _os.listdir(ddir) if f.endswith('.json'))
          assert len(dnames) >= 6, dnames
          for dn in dnames:
              daxes, _reg = load_axes(dn)
              assert len(daxes) >= 5 and all(a['gold'] in {'PROHIBITED','PERMITTED','REFUSE'} for a in daxes) and all(a['probe'].strip() for a in daxes)
          # domain-scoped card shape
          axes_b,_ = load_axes('bond')
          fake2 = {"model":"d","registry":"csoai.gspc-domains/bond/1.0","n":len(axes_b),"ok":4,"accuracy":0.6,
                   "measured":len(axes_b),"total":len(axes_b),"ts":"2026-08-23T00:00:00Z",
                   "per_axis":[{"axis":a['slug'],"gold":a['gold'],"verdict":("PASS" if i<4 else "FAIL"),"resp":"x","measured":True} for i,a in enumerate(axes_b)]}
          c2 = rax.as_card(fake2, {'id':'d','name':'d','digest':'x'}, axes=axes_b)
          assert c2['benchmark']['id']=='csoai.gspc-domains/bond/1.0' and len(c2['scores'])==len(axes_b)
          # crosswalk (east-west bridge): every domain has a provision map keyed to its axes
          from harness.run_axis import provision_map_for
          for dn2 in dnames:
              pm2 = provision_map_for(dn2)
              assert pm2 is not None and set(pm2.keys()) == {a['slug'] for a in load_axes(dn2)[0]}
              assert all(isinstance(v,list) and v and all(isinstance(p,str) and p for p in v) for v in pm2.values())
          assert provision_map_for(None) is None and 'provision_map' in c2 and len(c2['provision_map'])==6
          # A2A / MCP discovery surface (hermetic, in-process dispatch)
          import os as _os
          assert _os.path.exists(_os.path.join(os.getcwd(),'agent','agent.json'))
          assert _os.path.exists(_os.path.join(os.getcwd(),'agent','agent-card.json'))
          assert _os.path.exists(_os.path.join(os.getcwd(),'agent','mcp_server.py'))
          assert _os.path.exists(_os.path.join(os.getcwd(),'llms.txt'))
          assert _os.path.exists(_os.path.join(os.getcwd(),'a2a.md'))
          sys.path.insert(0, _os.path.join(os.getcwd(),'agent'))
          from mcp_server import dispatch
          disp_card = signed  # already-signed card from earlier in the CI step
          assert 'ok' in dispatch('dorado.verify', {'card': disp_card})
          assert set(dispatch('dorado.listDomains', {})['domains']) >= set(dnames)
          assert len(dispatch('dorado.crosswalk', {'domain':'cross-border'}))==6
          assert 'error' in dispatch('dorado.nope', {})
          # A2A client full-chain audit (spawns mcp_server as subprocess; hermetic)
          sys.path.insert(0, _os.path.join(os.getcwd(),'agent'))
          from dorado_a2a_client import audit as _audit
          import tempfile as _tmp
          _td = _tmp.mkdtemp()
          from dorado_receipt import build_card_receipt as _bcr
          from dorado_anchor import card_digest as _cd
          _sc2 = sign_card(card, key, kid='did:web:csoai.org#card-attestation-1', allow_test_identity=True)
          _rc2 = _bcr(_sc2, private_key=key, kid='did:web:csoai.org#card-attestation-1')
          _an2 = {"schema":"csoai.card-anchor/0.1","card_content_sha256":_cd(_sc2),
                  "anchors":[{"kind":"tsa-rfc3161","digest_sha256":_cd(_sc2),"message_imprint_matches":True,"gen_time":"2026-08-23T00:00:00Z"}]}
          _cp,_rp,_ap = _os.path.join(_td,'c.json'),_os.path.join(_td,'r.json'),_os.path.join(_td,'a.json')
          json.dump(_sc2,open(_cp,'w')); json.dump(_rc2,open(_rp,'w')); json.dump(_an2,open(_ap,'w'))
          _rep = _audit(_cp,_rp,_ap,server=_os.path.join(_os.getcwd(),'agent','mcp_server.py'))
          assert _rep['ok'] and all(s['ok'] for s in _rep['steps'])
          assert _os.path.exists(_os.path.join(os.getcwd(),'verify.html'))
          assert 'verify.html' in open(_os.path.join(os.getcwd(),'index.html')).read()
          # measurement board: content-address = digest, refuses unsigned, chain OK
          import tempfile as _tmpb
          _bd2 = _tmpb.mkdtemp()
          _prior = _os.environ.get('DORADO_BOARD_DIR'); _os.environ['DORADO_BOARD_DIR']=_bd2
          from harness.dorado_board import publish as _bp, rebuild_index as _bi, _card_hash as _bh
          try:
              _bp(card)  # card is unsigned -> refuse
              raise SystemExit('board should refuse unsigned')
          except ValueError:
              pass
          _sb2 = _sc2  # already-signed card from earlier in the step
          _eb = _bp(_sb2, _rc2)
          assert _eb.get('signed') is True and _eb['hash'] == _bh(_sb2)
          assert _bp(_sb2, _rc2).get('deduped', False)
          _ib = _bi()
          assert _ib['count'] >= 1 and _ib['chainOk']
          if _prior:
              _os.environ['DORADO_BOARD_DIR']=_prior
          else:
              _os.environ.pop('DORADO_BOARD_DIR',None)
          print('SIGN-VERIFY-EXPORT-RECEIPT-ANCHOR-LICENSE-DOMAINS-CROSSWALK-MCP-A2A-CLIENT-BOARD CI: PASS')
          PYEOF
